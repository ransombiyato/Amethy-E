name: Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Get JRE 8
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Run scripts
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out

      - name: Inspect gamepad remapper
        run: |
          gradle :app_pojavlauncher:dependencies --configuration debugRuntimeClasspath

          echo "=== Gamepad-related files ==="
          find ~/.gradle -type f 2>/dev/null | grep -Ei 'gamepad|boulay' || true

          echo "=== AARs containing gamepad resources ==="
          find ~/.gradle -type f -name "*.aar" -print0 2>/dev/null |
          while IFS= read -r -d '' aar; do
            if unzip -l "$aar" 2>/dev/null |
              grep -Eq 'button_a|button_b|button_x|button_start|button_select|dpad_|shoulder_|stick_|trigger_'; then
              echo "FOUND: $aar"
              unzip -l "$aar" |
                grep -E 'button_a|button_b|button_x|button_start|button_select|dpad_|shoulder_|stick_|trigger_'
            fi
          done

      - name: Build Debug APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/app-debug.apk

      - name: Generate md5
        run: |
          md5sum out/app-debug.apk > out/app-debug.md5

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/app-debug.*
